# mkosi.conf — общая конфигурация
# Варианты образов (base/controller/app/turnpike/dispatcher/docker) описаны в mkosi.profiles/*.

[Distribution]
Distribution=ubuntu
Release=noble
Architecture=x86-64
Repositories=main,universe,restricted,multiverse

[Build]
ToolsTree=default
WithNetwork=yes
Incremental=yes

[Output]
OutputDirectory=mkosi.output
CacheDirectory=mkosi.cache

[Content]
Packages=
  ca-certificates
  curl
  gnupg
  vim
  jq
  openssh-server
  sudo
  auditd
  dbus
  libpam-systemd
  tzdata
  netplan.io
  network-manager
  iproute2
  iputils-ping
  traceroute
  dnsutils
  less
  nano

# Локальные .deb (по умолчанию — mkosi.packages/)
PackageDirectories=mkosi.packages

# Внутренний APT (опционально):
#   1) отредактируйте mkosi.sandbox/etc/apt/sources.list.d/internal.list
#   2) создайте mkosi.local.conf и раскомментируйте SandboxTrees
# SandboxTrees=mkosi.sandbox
